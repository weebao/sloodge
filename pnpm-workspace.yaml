packages:
  - .

# Single source of truth for versions; package.json references them as "catalog:"
catalog:
  fflate: ^0.8.3
  parse5: ^8.0.1
  # Exact-pinned (M4.2): merges the per-slide single-page printToPDF outputs into one deck PDF.
  # Pure JS, no native deps (11-tech-stack.md R10). Pinned exact rather than ^1.17 so a patch
  # cannot change PDF byte output under us.
  pdf-lib: 1.17.1
  # Exact-pinned (M4.3): the only maintained JS library that emits standards-compliant OOXML .pptx,
  # giving both the structured (text/shape/image) path and the raster fallback via addImage
  # (11-tech-stack.md R11, 60-export.md §3). Pinned exact rather than ^4.0 so a patch cannot change
  # OOXML byte output — the OPC-structure tests assert on the emitted parts.
  pptxgenjs: 4.0.1
  zod: ^4.4.3
  react: ^19.2.8
  react-dom: ^19.2.8
  '@types/react': ^19.2
  '@types/react-dom': ^19.2
  typescript: 7.0.2
  vite: 7.3.6
  vitest: ^4.1.10
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3

# Only these may run postinstall scripts (pnpm 11 replaces onlyBuiltDependencies)
allowBuilds:
  electron: true
  esbuild: true
  '@tailwindcss/oxide': true
  # Pulled in by electron-builder for the Squirrel.Windows target, which Sloodge does not use (we
  # ship NSIS). Its postinstall downloads the Squirrel bundle — dead weight. Explicitly denied
  # rather than left undecided: an undecided build script makes `pnpm install` exit 1, and
  # electron-builder shells out to `pnpm install` as its dependency check, so leaving this
  # unanswered fails the packaging run itself.
  electron-winstaller: false

# Cross-build support (M5.2). The Agent SDK ships its ~275MB native `claude` CLI as per-platform
# optionalDependencies (`@anthropic-ai/claude-agent-sdk-<os>-<cpu>`), each guarded by `os`/`cpu`.
# By default pnpm installs ONLY the host's variant — so packaging a Windows app on this Linux/WSL
# dev machine would produce an installer with no Windows CLI in it and a dead chat panel, with
# nothing failing at build time. Naming `win32` here makes pnpm fetch `claude-agent-sdk-win32-x64`
# alongside the host's, which is what electron-builder then packs for `--win`.
#
# Deliberately NOT `darwin`: each variant is another 275MB, and macOS artifacts cannot be validly
# produced from Linux anyway (M9.2 builds them on real hardware, where `current` IS darwin).
#
# NOTE for M9.2: this is a **cartesian product** of `os` x `cpu`, not a list of pairs. On this
# linux/x64 host it expands to exactly linux-x64 + win32-x64. On the arm64 Mac M9.2 anticipates,
# `current` becomes darwin/arm64 and the same four lines expand to darwin-arm64, darwin-x64,
# win32-arm64 AND win32-x64 (~1GB), and each mac arch bundle would then carry both darwin CLIs.
# There, pin `cpu` to the host's own arch and add a
# `!**/node_modules/@anthropic-ai/claude-agent-sdk-darwin-<other-arch>/**` line to `build.mac.files`.
supportedArchitectures:
  os:
    - current
    - win32
  cpu:
    - current
    - x64

# Supply-chain guard: don't adopt an npm publish younger than 3 days
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk'
  - '@anthropic-ai/claude-agent-sdk-*'
