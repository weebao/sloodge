packages:
  - .

# Single source of truth for versions; package.json references them as "catalog:"
catalog:
  fflate: ^0.8.3
  parse5: ^8.0.1
  # Exact-pinned (M4.2): merges the per-slide single-page printToPDF outputs into one deck PDF.
  # Pure JS, no native deps (11-tech-stack.md R10). Pinned exact rather than ^1.17 so a patch
  # cannot change PDF byte output under us.
  pdf-lib: 1.17.1
  # Exact-pinned (M4.3): the only maintained JS library that emits standards-compliant OOXML .pptx,
  # giving both the structured (text/shape/image) path and the raster fallback via addImage
  # (11-tech-stack.md R11, 60-export.md §3). Pinned exact rather than ^4.0 so a patch cannot change
  # OOXML byte output — the OPC-structure tests assert on the emitted parts.
  pptxgenjs: 4.0.1
  zod: ^4.4.3
  react: ^19.2.8
  react-dom: ^19.2.8
  '@types/react': ^19.2
  '@types/react-dom': ^19.2
  typescript: 7.0.2
  vite: 7.3.6
  vitest: ^4.1.10
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3

# Only these may run postinstall scripts (pnpm 11 replaces onlyBuiltDependencies)
allowBuilds:
  electron: true
  esbuild: true
  '@tailwindcss/oxide': true

# Supply-chain guard: don't adopt an npm publish younger than 3 days
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk'
  - '@anthropic-ai/claude-agent-sdk-*'
