<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quarterly Revenue 2025</title>
<style>
  :root {
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 1280px; height: 720px; overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .slide {
    width: 1280px; height: 720px; overflow: hidden; position: relative;
    background: var(--surface-1);
    display: flex; flex-direction: column; align-items: center;
  }
  :root {
    --surface-1:      #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --grid-line:      rgba(11,11,11,0.12);
    --series-1:       #2a78d6;
    --series-1-strong:#154f97;
    --tooltip-bg:     #0b0b0b;
    --tooltip-fg:     #ffffff;
    --dim-opacity:    0.32;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --grid-line:      rgba(255,255,255,0.14);
      --series-1:       #3987e5;
      --series-1-strong:#8fc0ff;
      --tooltip-bg:     #ffffff;
      --tooltip-fg:     #0b0b0b;
      --dim-opacity:    0.28;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --grid-line:      rgba(255,255,255,0.14);
    --series-1:       #3987e5;
    --series-1-strong:#8fc0ff;
    --tooltip-bg:     #ffffff;
    --tooltip-fg:     #0b0b0b;
    --dim-opacity:    0.28;
  }

  .title {
    margin: 28px 0 4px 0;
    font-size: 44px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.5px;
  }

  .chart-wrap {
    position: relative;
    width: 900px;
    height: 460px;
    margin-top: 6px;
  }

  svg { display: block; width: 900px; height: 460px; }

  .axis-title {
    font-size: 18px;
    fill: var(--text-secondary);
    font-weight: 600;
  }
  .tick-label {
    font-size: 16px;
    fill: var(--text-secondary);
  }
  .cat-label {
    font-size: 20px;
    fill: var(--text-primary);
    font-weight: 600;
    text-anchor: middle;
  }
  .value-label {
    font-size: 17px;
    fill: var(--text-primary);
    font-weight: 700;
    text-anchor: middle;
  }
  .gridline { stroke: var(--grid-line); stroke-width: 1; }

  .bar {
    fill: var(--series-1);
    cursor: pointer;
    transition: fill 0.15s ease, opacity 0.15s ease;
  }
  .bar:hover {
    fill: var(--series-1-strong);
  }
  .bar.active {
    fill: var(--series-1-strong);
    stroke: var(--text-primary);
    stroke-width: 2;
  }
  .bar.dim {
    opacity: var(--dim-opacity);
  }
  .value-label.dim {
    opacity: var(--dim-opacity);
  }

  .tooltip {
    position: absolute;
    display: none;
    pointer-events: none;
    background: var(--tooltip-bg);
    color: var(--tooltip-fg);
    font-size: 18px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 8px;
    white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    transform: translate(-50%, -100%);
    z-index: 5;
  }

  .summary {
    margin-top: 14px;
    font-size: 20px;
    color: var(--text-primary);
    min-height: 28px;
  }
  .summary strong { color: var(--series-1-strong); }
</style>
</head>
<body>
<div class="slide">
  <div class="title">Quarterly Revenue 2025</div>

  <div class="chart-wrap">
    <svg id="chart" viewBox="0 0 900 460">
      <text class="axis-title" x="70" y="34">Revenue (Million USD)</text>

      <!-- gridlines + y ticks: scale 0-8M mapped to y 410..90 -->
      <g id="gridlines"></g>

      <!-- bars -->
      <g id="bars"></g>

      <!-- category labels -->
      <g id="catlabels"></g>

      <!-- value labels (hidden on hover of that bar) -->
      <g id="valuelabels"></g>
    </svg>
    <div class="tooltip" id="tooltip"></div>
  </div>

  <div class="summary" id="summary">Click a bar to see details</div>
</div>

<script>
(function () {
  var data = [
    { label: "Q1", value: 4.2 },
    { label: "Q2", value: 5.1 },
    { label: "Q3", value: 4.8 },
    { label: "Q4", value: 6.3 }
  ];

  var svgNS = "http://www.w3.org/2000/svg";
  var plotLeft = 70, plotRight = 880;
  var baselineY = 410, topY = 90; // topY corresponds to scaleMax
  var scaleMax = 8; // million
  var pxPerM = (baselineY - topY) / scaleMax; // 40 px per million

  function yFor(v) { return baselineY - v * pxPerM; }

  var barWidth = 140, gap = 50;
  var barsG = document.getElementById("bars");
  var catG = document.getElementById("catlabels");
  var valG = document.getElementById("valuelabels");
  var gridG = document.getElementById("gridlines");
  var tooltip = document.getElementById("tooltip");
  var summary = document.getElementById("summary");
  var chartWrap = document.querySelector(".chart-wrap");

  // gridlines + y-axis ticks at 0,2,4,6,8 M
  [0, 2, 4, 6, 8].forEach(function (v) {
    var y = yFor(v);
    var line = document.createElementNS(svgNS, "line");
    line.setAttribute("class", "gridline");
    line.setAttribute("x1", plotLeft);
    line.setAttribute("x2", plotRight);
    line.setAttribute("y1", y);
    line.setAttribute("y2", y);
    gridG.appendChild(line);

    var label = document.createElementNS(svgNS, "text");
    label.setAttribute("class", "tick-label");
    label.setAttribute("x", plotLeft - 10);
    label.setAttribute("y", y + 5);
    label.setAttribute("text-anchor", "end");
    label.textContent = v + "M";
    gridG.appendChild(label);
  });

  var bars = [];

  data.forEach(function (d, i) {
    var x = plotLeft + gap + i * (barWidth + gap);
    var y = yFor(d.value);
    var h = baselineY - y;
    var cx = x + barWidth / 2;

    var rect = document.createElementNS(svgNS, "rect");
    rect.setAttribute("class", "bar");
    rect.setAttribute("x", x);
    rect.setAttribute("y", y);
    rect.setAttribute("width", barWidth);
    rect.setAttribute("height", h);
    rect.setAttribute("rx", 4);
    rect.dataset.index = i;
    rect.dataset.label = d.label;
    rect.dataset.value = d.value;
    if (i === 0) {
      rect.setAttribute("data-hover-target", "");
      rect.setAttribute("data-click-target", "");
    }
    barsG.appendChild(rect);
    bars.push(rect);

    var cat = document.createElementNS(svgNS, "text");
    cat.setAttribute("class", "cat-label");
    cat.setAttribute("x", cx);
    cat.setAttribute("y", 438);
    cat.textContent = d.label;
    catG.appendChild(cat);

    var val = document.createElementNS(svgNS, "text");
    val.setAttribute("class", "value-label");
    val.setAttribute("x", cx);
    val.setAttribute("y", y - 12);
    val.dataset.index = i;
    val.textContent = d.value.toFixed(1) + "M";
    valG.appendChild(val);
  });

  function fmt(v) { return v.toFixed(1) + "M"; }

  function showTooltip(rect) {
    var i = +rect.dataset.index;
    var valueLabel = valG.querySelector('[data-index="' + i + '"]');
    valueLabel.classList.add("dim");
    valueLabel.style.visibility = "hidden";

    var x = parseFloat(rect.getAttribute("x"));
    var y = parseFloat(rect.getAttribute("y"));
    var w = parseFloat(rect.getAttribute("width"));
    var cx = x + w / 2;

    tooltip.textContent = "$" + fmt(+rect.dataset.value);
    tooltip.style.display = "block";
    // measure after making visible
    var tw = tooltip.offsetWidth;
    var left = cx;
    var minLeft = tw / 2 + 4;
    var maxLeft = 900 - tw / 2 - 4;
    if (left < minLeft) left = minLeft;
    if (left > maxLeft) left = maxLeft;
    var top = y - 12; // 12px gap above the bar top, tooltip anchored by its bottom edge
    tooltip.style.left = left + "px";
    tooltip.style.top = top + "px";
  }

  function hideTooltip(rect) {
    var i = +rect.dataset.index;
    var valueLabel = valG.querySelector('[data-index="' + i + '"]');
    valueLabel.classList.remove("dim");
    valueLabel.style.visibility = "visible";
    tooltip.style.display = "none";
  }

  bars.forEach(function (rect) {
    rect.addEventListener("mouseenter", function () { showTooltip(rect); });
    rect.addEventListener("mouseover", function () { showTooltip(rect); });
    rect.addEventListener("mouseleave", function () { hideTooltip(rect); });

    rect.addEventListener("click", function () {
      bars.forEach(function (b) {
        b.classList.remove("active");
        b.classList.add("dim");
      });
      rect.classList.remove("dim");
      rect.classList.add("active");

      valG.querySelectorAll(".value-label").forEach(function (lbl) {
        lbl.classList.add("dim");
      });
      var i = +rect.dataset.index;
      var ownLabel = valG.querySelector('[data-index="' + i + '"]');
      ownLabel.classList.remove("dim");

      summary.innerHTML = rect.dataset.label + " 2025 revenue: <strong>$" +
        fmt(+rect.dataset.value) + "</strong> — highest of the year: " +
        (rect.dataset.label === "Q4" ? "yes, this is the peak quarter." : "no, Q4 is higher at $6.3M.");
    });
  });
})();
</script>
</body>
</html>
