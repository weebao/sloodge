<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CI/CD Pipeline</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b1220;
  }
  .slide {
    width: 1280px;
    height: 720px;
    overflow: hidden;
    position: relative;
    background: linear-gradient(160deg, #0b1220 0%, #10192e 60%, #0b1220 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    box-sizing: border-box;
    padding: 48px;
    color: #e9edf5;
  }
  .title {
    font-size: 44px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 8px 0;
    color: #f5f7fb;
  }
  .subtitle {
    font-size: 20px;
    font-weight: 400;
    color: #93a0bd;
    margin: 0 0 20px 0;
  }
  .diagram-wrap {
    width: 100%;
    height: 540px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg {
    overflow: visible;
  }
  .stage-box {
    fill: #141d33;
    stroke: #3a4a72;
    stroke-width: 2;
  }
  .stage-icon-bg {
    fill: #1d2c4d;
  }
  .stage-label {
    fill: #f5f7fb;
    font-size: 26px;
    font-weight: 700;
    text-anchor: middle;
    dominant-baseline: middle;
  }
  .stage-sub {
    fill: #8ea0c8;
    font-size: 15px;
    font-weight: 500;
    text-anchor: middle;
    dominant-baseline: middle;
  }
  .flow-arrow {
    stroke: #4a5d8a;
    stroke-width: 3;
    fill: none;
  }
  .flow-arrow-dash {
    stroke: #5eead4;
    stroke-width: 3;
    fill: none;
    stroke-dasharray: 10 14;
    animation: dashflow 1.4s linear infinite;
    opacity: 0.85;
  }
  @keyframes dashflow {
    to { stroke-dashoffset: -48; }
  }
  .stage-glow {
    fill: none;
    stroke: #5eead4;
    stroke-width: 4;
    opacity: 0;
  }
  .glow1 { animation: glowpulse 4s linear infinite; animation-delay: 0s; }
  .glow2 { animation: glowpulse 4s linear infinite; animation-delay: 1s; }
  .glow3 { animation: glowpulse 4s linear infinite; animation-delay: 2s; }
  .glow4 { animation: glowpulse 4s linear infinite; animation-delay: 3s; }
  @keyframes glowpulse {
    0%   { opacity: 0; stroke-width: 4; }
    6%   { opacity: 1; stroke-width: 7; }
    22%  { opacity: 0; stroke-width: 4; }
    100% { opacity: 0; stroke-width: 4; }
  }
  .pulse-dot {
    fill: #5eead4;
    filter: drop-shadow(0 0 8px #5eead4);
  }
  .pulse-ring {
    fill: none;
    stroke: #5eead4;
    stroke-width: 2;
    opacity: 0.6;
    animation: ringpulse 1s ease-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  @keyframes ringpulse {
    0%   { r: 8; opacity: 0.7; }
    100% { r: 20; opacity: 0; }
  }
</style>
</head>
<body>
<div class="slide">
  <h1 class="title">CI/CD Pipeline</h1>
  <p class="subtitle">Automated flow from code change to production observability</p>

  <div class="diagram-wrap">
    <svg width="1120" height="480" viewBox="0 0 1120 480">
      <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
          <path d="M0,0 L10,5 L0,10 Z" fill="#4a5d8a"/>
        </marker>

        <!-- Invisible path tracing through all four stage centers, used for pulse motion -->
        <path id="flowPath"
              d="M 140,240 L 400,240 L 660,240 L 920,240"
              fill="none" stroke="none"/>
      </defs>

      <!-- Connector arrows between stages -->
      <line class="flow-arrow" x1="240" y1="240" x2="378" y2="240" marker-end="url(#arrowhead)"/>
      <line class="flow-arrow-dash" x1="240" y1="240" x2="378" y2="240"/>

      <line class="flow-arrow" x1="500" y1="240" x2="638" y2="240" marker-end="url(#arrowhead)"/>
      <line class="flow-arrow-dash" x1="500" y1="240" x2="638" y2="240"/>

      <line class="flow-arrow" x1="760" y1="240" x2="898" y2="240" marker-end="url(#arrowhead)"/>
      <line class="flow-arrow-dash" x1="760" y1="240" x2="898" y2="240"/>

      <!-- Stage 1: Build -->
      <g>
        <rect class="stage-glow glow1" x="60" y="170" width="180" height="140" rx="18"/>
        <rect class="stage-box" x="60" y="170" width="180" height="140" rx="18"/>
        <circle class="stage-icon-bg" cx="150" cy="222" r="26"/>
        <path d="M138,222 l8,-14 h8 l8,14 z M136,226 h28 v6 h-28 z" fill="#5eead4"/>
        <text class="stage-label" x="150" y="270">Build</text>
        <text class="stage-sub" x="150" y="292">compile &amp; package</text>
      </g>

      <!-- Stage 2: Test -->
      <g>
        <rect class="stage-glow glow2" x="320" y="170" width="180" height="140" rx="18"/>
        <rect class="stage-box" x="320" y="170" width="180" height="140" rx="18"/>
        <circle class="stage-icon-bg" cx="410" cy="222" r="26"/>
        <path d="M397,222 l9,9 l16,-18" stroke="#5eead4" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="stage-label" x="410" y="270">Test</text>
        <text class="stage-sub" x="410" y="292">unit &amp; integration</text>
      </g>

      <!-- Stage 3: Deploy -->
      <g>
        <rect class="stage-glow glow3" x="580" y="170" width="180" height="140" rx="18"/>
        <rect class="stage-box" x="580" y="170" width="180" height="140" rx="18"/>
        <circle class="stage-icon-bg" cx="670" cy="222" r="26"/>
        <path d="M670,208 l12,16 h-8 v10 h-8 v-10 h-8 z" fill="#5eead4"/>
        <text class="stage-label" x="670" y="270">Deploy</text>
        <text class="stage-sub" x="670" y="292">release to prod</text>
      </g>

      <!-- Stage 4: Monitor -->
      <g>
        <rect class="stage-glow glow4" x="840" y="170" width="180" height="140" rx="18"/>
        <rect class="stage-box" x="840" y="170" width="180" height="140" rx="18"/>
        <circle class="stage-icon-bg" cx="930" cy="222" r="26"/>
        <path d="M918,228 l7,-12 l6,8 l6,-16 l6,20" stroke="#5eead4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="stage-label" x="930" y="270">Monitor</text>
        <text class="stage-sub" x="930" y="292">observe &amp; alert</text>
      </g>

      <!-- Pulse dot travelling through all stages in sequence, looping forever -->
      <g>
        <circle class="pulse-ring" r="8" cx="0" cy="0">
          <animateMotion dur="4s" repeatCount="indefinite" rotate="0">
            <mpath href="#flowPath"/>
          </animateMotion>
        </circle>
        <circle class="pulse-dot" r="9" cx="0" cy="0">
          <animateMotion dur="4s" repeatCount="indefinite" rotate="0">
            <mpath href="#flowPath"/>
          </animateMotion>
        </circle>
      </g>
    </svg>
  </div>
</div>
</body>
</html>
