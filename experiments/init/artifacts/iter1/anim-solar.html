<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Solar System Orbits</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #05070f;
  }
  .slide {
    width: 1280px;
    height: 720px;
    overflow: hidden;
    position: relative;
    background: radial-gradient(ellipse at 50% 40%, #0c1330 0%, #05070f 70%);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #f5f7fb;
    box-sizing: border-box;
    padding: 48px;
  }
  .title {
    font-size: 40px;
    font-weight: 700;
    margin: 0 0 4px 0;
    letter-spacing: 0.3px;
  }
  .subtitle {
    font-size: 18px;
    font-weight: 400;
    margin: 0 0 8px 0;
    color: #b7c0d8;
  }
  .stage {
    width: 100%;
    height: 560px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg {
    display: block;
  }

  /* Background stars, gentle twinkle, compositor-friendly (opacity only) */
  .star {
    animation: twinkle 3s ease-in-out infinite;
  }
  .star.s2 { animation-duration: 4s; animation-delay: 0.6s; }
  .star.s3 { animation-duration: 2.4s; animation-delay: 1.2s; }
  .star.s4 { animation-duration: 3.6s; animation-delay: 0.3s; }
  @keyframes twinkle {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.95; }
  }

  /* Sun pulse glow */
  .sun-core {
    animation: sunpulse 2.4s ease-in-out infinite;
    transform-origin: 640px 340px;
  }
  @keyframes sunpulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  .sun-glow {
    animation: glowpulse 2.4s ease-in-out infinite;
    transform-origin: 640px 340px;
  }
  @keyframes glowpulse {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50% { opacity: 0.85; transform: scale(1.12); }
  }

  /* Orbit rotation groups - rotate around sun center (640,340) */
  .orbit-group {
    transform-origin: 640px 340px;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  .orbit-1 { animation-name: spin; animation-duration: 4s; }
  .orbit-2 { animation-name: spin; animation-duration: 7s; }
  .orbit-3 { animation-name: spin; animation-duration: 11s; }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Counter-rotate labels so they stay upright and readable */
  .counter-1 { transform-origin: 640px 340px; animation: spinback1 4s linear infinite; }
  .counter-2 { transform-origin: 640px 340px; animation: spinback2 7s linear infinite; }
  .counter-3 { transform-origin: 640px 340px; animation: spinback3 11s linear infinite; }
  @keyframes spinback1 { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
  @keyframes spinback2 { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
  @keyframes spinback3 { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

  /* Planet self-spin for a bit of extra life (subtle) */
  .planet-body {
    animation: bodyspin 6s linear infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  @keyframes bodyspin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .legend-text {
    font-size: 15px;
    fill: #cfd6ea;
    font-weight: 600;
  }
  .orbit-caption {
    font-size: 13px;
    fill: #8b93b0;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="title">The Solar System</div>
  <div class="subtitle">Three planets orbiting the Sun at different speeds</div>
  <div class="stage">
    <svg width="1180" height="560" viewBox="0 0 1280 640">
      <defs>
        <radialGradient id="sunGradient" cx="35%" cy="35%" r="65%">
          <stop offset="0%" stop-color="#fff6d6"/>
          <stop offset="45%" stop-color="#ffd45e"/>
          <stop offset="100%" stop-color="#ff8a1e"/>
        </radialGradient>
        <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffcf6b" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#ffcf6b" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="mercuryGrad" cx="35%" cy="35%" r="65%">
          <stop offset="0%" stop-color="#e8d9c8"/>
          <stop offset="100%" stop-color="#9c8a76"/>
        </radialGradient>
        <radialGradient id="earthGrad" cx="35%" cy="35%" r="65%">
          <stop offset="0%" stop-color="#7ec8ff"/>
          <stop offset="55%" stop-color="#3f8ee0"/>
          <stop offset="100%" stop-color="#215fa8"/>
        </radialGradient>
        <radialGradient id="marsGrad" cx="35%" cy="35%" r="65%">
          <stop offset="0%" stop-color="#ffb08a"/>
          <stop offset="55%" stop-color="#e0633a"/>
          <stop offset="100%" stop-color="#9c3d1f"/>
        </radialGradient>
      </defs>

      <!-- Background stars -->
      <g fill="#ffffff">
        <circle class="star s1" cx="60" cy="60" r="1.6"/>
        <circle class="star s2" cx="150" cy="180" r="1.2"/>
        <circle class="star s3" cx="90" cy="420" r="1.8"/>
        <circle class="star s4" cx="220" cy="540" r="1.3"/>
        <circle class="star s2" cx="1180" cy="70" r="1.5"/>
        <circle class="star s3" cx="1120" cy="500" r="1.4"/>
        <circle class="star s1" cx="1220" cy="300" r="1.7"/>
        <circle class="star s4" cx="1050" cy="150" r="1.2"/>
        <circle class="star s3" cx="330" cy="90" r="1.3"/>
        <circle class="star s2" cx="980" cy="580" r="1.6"/>
        <circle class="star s1" cx="60" cy="600" r="1.3"/>
        <circle class="star s4" cx="1230" cy="600" r="1.5"/>
        <circle class="star s2" cx="480" cy="40" r="1.2"/>
        <circle class="star s3" cx="820" cy="40" r="1.4"/>
        <circle class="star s1" cx="380" cy="600" r="1.3"/>
        <circle class="star s4" cx="720" cy="610" r="1.5"/>
      </g>

      <!-- Orbit paths -->
      <circle cx="640" cy="340" r="110" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-dasharray="3 5"/>
      <circle cx="640" cy="340" r="185" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" stroke-dasharray="3 5"/>
      <circle cx="640" cy="340" r="260" fill="none" stroke="rgba(255,255,255,0.20)" stroke-width="1.5" stroke-dasharray="3 5"/>

      <!-- Sun -->
      <circle class="sun-glow" cx="640" cy="340" r="70" fill="url(#sunGlow)"/>
      <circle class="sun-core" cx="640" cy="340" r="38" fill="url(#sunGradient)"/>
      <text x="640" y="410" text-anchor="middle" class="legend-text" fill="#ffdf9e">Sun</text>

      <!-- Orbit 1: Mercury, fastest, 4s -->
      <g class="orbit-group orbit-1">
        <circle cx="750" cy="340" r="12" fill="url(#mercuryGrad)" class="planet-body"/>
      </g>
      <g class="counter-1">
        <text x="750" y="322" text-anchor="middle" class="legend-text">Mercury</text>
      </g>

      <!-- Orbit 2: Earth, medium, 7s -->
      <g class="orbit-group orbit-2">
        <circle cx="825" cy="340" r="16" fill="url(#earthGrad)" class="planet-body"/>
      </g>
      <g class="counter-2">
        <text x="825" y="318" text-anchor="middle" class="legend-text">Earth</text>
      </g>

      <!-- Orbit 3: Mars, slowest, 11s -->
      <g class="orbit-group orbit-3">
        <circle cx="900" cy="340" r="14" fill="url(#marsGrad)" class="planet-body"/>
      </g>
      <g class="counter-3">
        <text x="900" y="320" text-anchor="middle" class="legend-text">Mars</text>
      </g>

      <!-- Orbit period captions -->
      <text x="640" y="470" text-anchor="middle" class="orbit-caption">Mercury: 4s / orbit</text>
      <text x="640" y="500" text-anchor="middle" class="orbit-caption">Earth: 7s / orbit</text>
      <text x="640" y="530" text-anchor="middle" class="orbit-caption">Mars: 11s / orbit</text>
    </svg>
  </div>
</div>
</body>
</html>
