<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0}
  *,*::before,*::after{box-sizing:border-box}
  body{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .slide{
    width:1280px;height:720px;overflow:hidden;position:relative;box-sizing:border-box;
    background:linear-gradient(180deg,#050b16 0%,#081226 45%,#0b1a33 100%);
  }
  .glow{
    position:absolute; top:-200px; left:50%; transform:translateX(-50%);
    width:900px; height:900px; border-radius:50%;
    background:radial-gradient(circle, rgba(45,166,178,0.18) 0%, rgba(45,166,178,0) 65%);
    z-index:0;
  }
  .content{
    position:relative; z-index:1;
    height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:48px;
    text-align:center;
  }
  .kicker{
    color:#5fd4e0;
    font-size:20px;
    letter-spacing:4px;
    font-weight:600;
    text-transform:uppercase;
    margin-bottom:28px;
    opacity:0.9;
  }
  .title{
    color:#f0f4f8;
    font-size:80px;
    font-weight:800;
    line-height:1.15;
    max-width:1080px;
    margin:0 0 12px 0;
    letter-spacing:-1px;
  }
  .title .accent{
    color:#4fd1c5;
  }
  .subtitle{
    color:#cfd8e3;
    font-size:26px;
    font-weight:400;
    margin-top:26px;
    letter-spacing:0.5px;
  }
  .dept{
    color:#7a8ba3;
    font-size:22px;
    font-weight:400;
    margin-top:8px;
  }
  .divider{
    width:120px;
    height:3px;
    background:linear-gradient(90deg, rgba(79,209,197,0), #4fd1c5, rgba(79,209,197,0));
    margin:32px 0;
  }
  .waves{
    position:absolute;
    bottom:0; left:0; width:1280px; height:220px;
    z-index:0;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="glow"></div>

  <svg class="waves" viewBox="0 0 1280 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,140 C160,180 320,100 480,130 C640,160 800,90 960,120 C1120,150 1200,110 1280,130 L1280,220 L0,220 Z"
          fill="#0e2a44" opacity="0.55"/>
    <path d="M0,170 C180,120 340,190 520,160 C700,130 860,200 1040,170 C1150,152 1220,175 1280,165 L1280,220 L0,220 Z"
          fill="#0a2038" opacity="0.7"/>
    <path d="M0,195 C200,160 380,210 560,190 C760,168 920,215 1120,195 C1180,188 1240,198 1280,193 L1280,220 L0,220 Z"
          fill="#071427" opacity="0.9"/>
  </svg>

  <div class="content">
    <div class="kicker">A Talk On Marine Science</div>
    <div class="title">The Deep Ocean:<br><span class="accent">Earth's Last Frontier</span></div>
    <div class="divider"></div>
    <div class="subtitle">Dr. Maya Chen</div>
    <div class="dept">Marine Biology Department</div>
  </div>
</div>
</body>
</html>
