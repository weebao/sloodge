<title>CI/CD Pipeline</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #0b1220; }
  .slide {
    width: 1280px;
    height: 720px;
    overflow: hidden;
    position: relative;
    background: radial-gradient(ellipse at 20% 0%, #14213d 0%, #0b1220 55%, #090e1a 100%);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 48px;
    color: #e8edf7;
  }

  .eyebrow {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #6ee7d8;
  }

  h1 {
    font-size: 48px;
    font-weight: 800;
    letter-spacing: -0.01em;
    color: #f7fafc;
    margin-top: 6px;
  }

  .subtitle {
    margin-top: 10px;
    font-size: 20px;
    color: #a9b6cf;
    font-weight: 400;
  }

  .diagram-wrap {
    position: absolute;
    left: 48px;
    right: 48px;
    top: 190px;
    bottom: 48px;
  }

  .stage-label {
    font-size: 26px;
    font-weight: 700;
    fill: #f7fafc;
  }

  .stage-sub {
    font-size: 15px;
    font-weight: 500;
    fill: #8fa2c4;
  }

  .badge-num {
    font-size: 18px;
    font-weight: 800;
    fill: #0b1220;
  }

  .box {
    fill: #131f38;
    stroke: #2b3c60;
    stroke-width: 2;
  }

  .box-glow-1 { animation: stageGlow 3s infinite; animation-delay: 0s; }
  .box-glow-2 { animation: stageGlow 3s infinite; animation-delay: 1s; }
  .box-glow-3 { animation: stageGlow 3s infinite; animation-delay: 2s; }
  .box-glow-4 { animation: stageGlow 3s infinite; animation-delay: 3s; }

  @keyframes stageGlow {
    0%   { stroke: #6ee7d8; filter: drop-shadow(0 0 14px rgba(110,231,216,0.85)); }
    18%  { stroke: #2b3c60; filter: drop-shadow(0 0 0 rgba(110,231,216,0)); }
    100% { stroke: #2b3c60; filter: drop-shadow(0 0 0 rgba(110,231,216,0)); }
  }

  .connector {
    stroke: #3a4d75;
    stroke-width: 3;
    fill: none;
  }

  .pulse {
    fill: #6ee7d8;
    filter: drop-shadow(0 0 8px rgba(110,231,216,0.9));
  }

  .badge {
    fill: #6ee7d8;
  }
</style>

<div class="slide">
  <div class="eyebrow">DEVOPS WORKFLOW</div>
  <h1>CI/CD Pipeline</h1>
  <div class="subtitle">Every commit flows automatically from build to production monitoring</div>

  <div class="diagram-wrap">
    <svg viewBox="0 0 1280 480" width="1280" height="480" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="9" markerHeight="9" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 Z" fill="#3a4d75"></path>
        </marker>
      </defs>

      <!-- ===== Connectors (also used as SMIL motion paths for the pulse) ===== -->
      <path id="segA" class="connector" marker-end="url(#arrow)" d="M268,180 L369,180"></path>
      <path id="segB" class="connector" marker-end="url(#arrow)" d="M589,180 L690,180"></path>
      <path id="segC" class="connector" marker-end="url(#arrow)" d="M910,180 L1011,180"></path>

      <!-- ===== Stage 1: Build ===== -->
      <g>
        <rect class="box box-glow-1" x="48" y="100" width="220" height="160" rx="16"></rect>
        <circle class="badge" cx="88" cy="140" r="18"></circle>
        <text class="badge-num" x="88" y="146" text-anchor="middle">1</text>
        <text class="stage-label" x="78" y="200">Build</text>
        <text class="stage-sub" x="78" y="226">Compile &amp; package</text>
      </g>

      <!-- ===== Stage 2: Test ===== -->
      <g>
        <rect class="box box-glow-2" x="369" y="100" width="220" height="160" rx="16"></rect>
        <circle class="badge" cx="409" cy="140" r="18"></circle>
        <text class="badge-num" x="409" y="146" text-anchor="middle">2</text>
        <text class="stage-label" x="399" y="200">Test</text>
        <text class="stage-sub" x="399" y="226">Run automated suite</text>
      </g>

      <!-- ===== Stage 3: Deploy ===== -->
      <g>
        <rect class="box box-glow-3" x="690" y="100" width="220" height="160" rx="16"></rect>
        <circle class="badge" cx="730" cy="140" r="18"></circle>
        <text class="badge-num" x="730" y="146" text-anchor="middle">3</text>
        <text class="stage-label" x="720" y="200">Deploy</text>
        <text class="stage-sub" x="720" y="226">Ship to production</text>
      </g>

      <!-- ===== Stage 4: Monitor ===== -->
      <g>
        <rect class="box box-glow-4" x="1011" y="100" width="220" height="160" rx="16"></rect>
        <circle class="badge" cx="1051" cy="140" r="18"></circle>
        <text class="badge-num" x="1051" y="146" text-anchor="middle">4</text>
        <text class="stage-label" x="1041" y="200">Monitor</text>
        <text class="stage-sub" x="1041" y="226">Track health &amp; alerts</text>
      </g>

      <!-- ===== Pulse traveling stage-to-stage, looping forever ===== -->
      <circle class="pulse" r="8" cx="0" cy="0">
        <animateMotion id="moveA" dur="1s" begin="0s;moveC.end" fill="freeze">
          <mpath href="#segA"></mpath>
        </animateMotion>
        <animateMotion id="moveB" dur="1s" begin="moveA.end" fill="freeze">
          <mpath href="#segB"></mpath>
        </animateMotion>
        <animateMotion id="moveC" dur="1s" begin="moveB.end" fill="freeze">
          <mpath href="#segC"></mpath>
        </animateMotion>
        <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.05;0.9;0.95;1"
                 dur="3s" begin="0s;moveC.end" repeatCount="1"></animate>
      </circle>
    </svg>
  </div>
</div>
