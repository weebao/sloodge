<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>The Deep Ocean: Earth's Last Frontier</title>
<style>
  html,body{margin:0;padding:0}
  *,*::before,*::after{box-sizing:border-box}
  body{background:#0d1220;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .slide{
    width:1280px;height:720px;overflow:hidden;position:relative;box-sizing:border-box;
    background:radial-gradient(ellipse at 30% 20%, #16213a 0%, #0d1220 55%, #080b14 100%);
  }
  .content{
    position:absolute;
    left:0; right:0; top:0; bottom:160px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:48px 96px;
    z-index:1;
    text-align:center;
  }
  .eyebrow{
    color:#6fd6d6;
    font-size:20px;
    font-weight:600;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:24px;
    opacity:0.85;
  }
  h1{
    color:#f2f6fb;
    font-size:76px;
    font-weight:800;
    line-height:1.15;
    margin:0 0 28px 0;
    max-width:1040px;
    letter-spacing:-0.5px;
  }
  .accent{
    color:#4fd1c5;
  }
  .subtitle{
    color:#aab4c8;
    font-size:28px;
    font-weight:500;
    margin:0 0 6px 0;
  }
  .dept{
    color:#8ea0bd;
    font-size:24px;
    font-weight:400;
    margin:0;
  }
  .rule{
    width:120px;
    height:3px;
    background:linear-gradient(90deg, transparent, #4fd1c5, transparent);
    margin:28px auto 28px auto;
  }
  .wave-wrap{
    position:absolute;
    left:0; right:0; bottom:0;
    height:220px;
    z-index:0;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="content">
    <div class="eyebrow">A Talk On Marine Exploration</div>
    <h1>The Deep Ocean:<br><span class="accent">Earth's Last Frontier</span></h1>
    <div class="rule"></div>
    <p class="subtitle">Dr. Maya Chen</p>
    <p class="dept">Marine Biology Dept.</p>
  </div>

  <div class="wave-wrap">
    <svg width="1280" height="220" viewBox="0 0 1280 220" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <path d="M0,150 C160,110 320,190 480,150 C640,110 800,190 960,150 C1120,110 1280,180 1280,180 L1280,220 L0,220 Z"
            fill="#132038" opacity="0.55"/>
      <path d="M0,180 C160,150 320,210 480,180 C640,150 800,210 960,180 C1120,150 1280,205 1280,205 L1280,220 L0,220 Z"
            fill="#0f1a2e" opacity="0.75"/>
      <path d="M0,165 C140,140 260,175 400,160 C540,145 660,180 800,165 C940,150 1080,180 1280,160"
            fill="none" stroke="#4fd1c5" stroke-width="2" opacity="0.35"/>
      <path d="M0,195 C140,175 260,205 400,190 C540,175 660,205 800,192 C940,178 1080,205 1280,190"
            fill="none" stroke="#4fd1c5" stroke-width="1.5" opacity="0.25"/>
    </svg>
  </div>
</div>
</body>
</html>
