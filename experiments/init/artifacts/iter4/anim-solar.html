<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Solar System Orbits</title>
<style>
  html, body { margin: 0; padding: 0; background: #05060c; }
  .slide {
    width: 1280px;
    height: 720px;
    position: relative;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 30%, #10131f 0%, #05060a 70%);
    box-sizing: border-box;
    padding: 48px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #f4f6fb;
  }
  h1 {
    margin: 0;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  p.subtitle {
    margin: 8px 0 0 0;
    font-size: 18px;
    color: #a9b1c9;
  }
  .stars circle {
    fill: #ffffff;
    opacity: 0.5;
  }
  .orbit-path {
    fill: none;
    stroke: rgba(160, 180, 255, 0.28);
    stroke-width: 1.5;
    stroke-dasharray: 3 6;
  }
  .label-chip {
    fill: #0b0e1a;
    stroke: rgba(160, 180, 255, 0.4);
    stroke-width: 1;
  }
  .label-text {
    font-size: 18px;
    font-weight: 600;
    fill: #f4f6fb;
    text-anchor: middle;
    dominant-baseline: middle;
  }
  .sun-chip {
    fill: #1a1206;
    stroke: rgba(255, 200, 120, 0.5);
    stroke-width: 1;
  }
  .sun-text {
    font-size: 18px;
    font-weight: 700;
    fill: #ffd27a;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  .sun-core {
    animation: pulseSun 3s ease-in-out infinite;
    transform-box: view-box;
    transform-origin: 640px 400px;
  }
  @keyframes pulseSun {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
</style>
</head>
<body>
<div class="slide">
  <h1>The Solar System</h1>
  <p class="subtitle">Three planets orbiting the Sun at different speeds</p>

  <svg width="1280" height="720" viewBox="0 0 1280 720" style="position:absolute; top:0; left:0;">
    <!-- background stars, all within safe area -->
    <g class="stars">
      <circle cx="90" cy="90" r="1.4"/>
      <circle cx="150" cy="600" r="1.2"/>
      <circle cx="1180" cy="120" r="1.5"/>
      <circle cx="1150" cy="600" r="1.3"/>
      <circle cx="60" cy="350" r="1.2"/>
      <circle cx="1220" cy="360" r="1.3"/>
      <circle cx="220" cy="150" r="1.1"/>
      <circle cx="1050" cy="620" r="1.2"/>
      <circle cx="980" cy="90" r="1.3"/>
      <circle cx="330" cy="640" r="1.1"/>
    </g>

    <!-- orbit paths, drawn before motion elements, radii match rotation radii -->
    <circle class="orbit-path" cx="640" cy="400" r="120"/>
    <circle class="orbit-path" cx="640" cy="400" r="190"/>
    <circle class="orbit-path" cx="640" cy="400" r="260"/>

    <!-- Sun -->
    <g class="sun-core">
      <defs>
        <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff3c4"/>
          <stop offset="45%" stop-color="#ffcf5c"/>
          <stop offset="100%" stop-color="#ff8f2e"/>
        </radialGradient>
      </defs>
      <circle cx="640" cy="400" r="46" fill="url(#sunGrad)"/>
    </g>
    <!-- Sun label: dark chip below the glowing sun for contrast -->
    <rect class="sun-chip" x="600" y="452" width="80" height="28" rx="8"/>
    <text class="sun-text" x="640" y="467">Sun</text>

    <!-- Orbit 1: Mercury-like, fastest -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 640 400" to="360 640 400" dur="4s" repeatCount="indefinite"/>
      <circle cx="760" cy="400" r="9" fill="#c9c2b4"/>
      <!-- label rides with the planet: translate to planet's local position, then
           counter-rotate opposite the orbit rotation so text stays upright -->
      <g transform="translate(760,400)">
        <g>
          <animateTransform attributeName="transform" type="rotate"
            from="0 0 0" to="-360 0 0" dur="4s" repeatCount="indefinite"/>
          <rect class="label-chip" x="-45" y="-42" width="90" height="26" rx="8"/>
          <text class="label-text" x="0" y="-29">Mercuria</text>
        </g>
      </g>
    </g>

    <!-- Orbit 2: middle speed -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="120 640 400" to="480 640 400" dur="7s" repeatCount="indefinite"/>
      <circle cx="830" cy="400" r="12" fill="#7fb0ff"/>
      <g transform="translate(830,400)">
        <g>
          <animateTransform attributeName="transform" type="rotate"
            from="-120 0 0" to="-480 0 0" dur="7s" repeatCount="indefinite"/>
          <rect class="label-chip" x="-39" y="-45" width="78" height="26" rx="8"/>
          <text class="label-text" x="0" y="-32">Aquara</text>
        </g>
      </g>
    </g>

    <!-- Orbit 3: slowest -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="240 640 400" to="600 640 400" dur="11s" repeatCount="indefinite"/>
      <circle cx="900" cy="400" r="14" fill="#ff8a65"/>
      <g transform="translate(900,400)">
        <g>
          <animateTransform attributeName="transform" type="rotate"
            from="-240 0 0" to="-600 0 0" dur="11s" repeatCount="indefinite"/>
          <rect class="label-chip" x="-42" y="-47" width="84" height="26" rx="8"/>
          <text class="label-text" x="0" y="-34">Terraxa</text>
        </g>
      </g>
    </g>
  </svg>
</div>
</body>
</html>
