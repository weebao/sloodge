<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0}
  *,*::before,*::after{box-sizing:border-box}
  body{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .slide{
    width:1280px;height:720px;overflow:hidden;position:relative;box-sizing:border-box;
    background:linear-gradient(180deg,#0a1220 0%,#0d1a2e 55%,#0f2038 100%);
  }
  .content{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:1;
    height:600px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:48px;
  }
  .title{
    font-size:76px;
    font-weight:700;
    color:#f2f5fa;
    line-height:1.15;
    max-width:1080px;
    letter-spacing:-0.5px;
  }
  .divider{
    width:120px;
    height:3px;
    background:#3fa9e0;
    margin:36px 0;
    border-radius:2px;
  }
  .speaker{
    font-size:30px;
    font-weight:600;
    color:#dfe6f2;
  }
  .dept{
    font-size:24px;
    font-weight:400;
    color:#aab4c8;
    margin-top:10px;
  }
  .waves{
    position:absolute;
    left:0;
    bottom:0;
    width:1280px;
    height:180px;
    z-index:0;
  }
</style>
</head>
<body>
<div class="slide">
  <svg class="waves" viewBox="0 0 1280 180" preserveAspectRatio="none">
    <path d="M-480,90 C-320,40 -160,140 0,90 C160,40 320,140 480,90 C640,40 800,140 960,90 C1120,40 1280,140 1440,90 C1600,40 1760,140 1920,90 L1920,180 L-480,180 Z" fill="#12294a" opacity="0.55"/>
    <path d="M-540,120 C-360,70 -180,170 0,120 C180,70 360,170 540,120 C720,70 900,170 1080,120 C1260,70 1440,170 1620,120 L1620,180 L-540,180 Z" fill="#0e2038" opacity="0.7"/>
    <path d="M-640,150 C-427,115 -213,180 0,150 C213,115 427,180 640,150 C853,115 1067,180 1280,150 C1493,115 1707,180 1920,150 L1920,180 L-640,180 Z" fill="#0a1626" opacity="0.85"/>
  </svg>
  <div class="content">
    <div class="title">The Deep Ocean: Earth's Last Frontier</div>
    <div class="divider"></div>
    <div class="speaker">Dr. Maya Chen</div>
    <div class="dept">Marine Biology Dept.</div>
  </div>
</div>
</body>
</html>
