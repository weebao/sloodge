<!doctype html><meta charset="utf-8" /><style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html,
  body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
  }
  body {
    font-family: Arial, sans-serif;
  }
</style>
<style>
  /* Review r4, blocker B6, half one of two: the CONTROL. This file and
     `x18-view-transition-name.html` differ in exactly one declaration, and a test asserts that.
     Here `.behind` sits in the root stacking context, so its `z-index: -1` puts it BEHIND the
     green panel's background: the reader sees red only in the 25px that overhang the panel, and
     the exporter's shape order (red, then green over it) is right. */
  body {
    background: #f8fafc;
    padding: 64px;
    color: #0f172a;
  }
  h1 {
    font-size: 42px;
    font-weight: 800;
  }
  .outer {
    position: relative;
    margin-top: 140px;
    margin-left: 96px;
    width: 300px;
    height: 200px;
    background: #22c55e;
  }
  .behind {
    position: absolute;
    z-index: -1;
    left: -25px;
    top: -25px;
    width: 120px;
    height: 120px;
    background: #dc2626;
  }
</style>
<h1>Paint order: a z-index:-1 child under its parent</h1>
<div class="outer">
  <div class="behind"></div>
</div>
