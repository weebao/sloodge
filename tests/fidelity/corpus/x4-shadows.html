<!doctype html><meta charset="utf-8" /><style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html,
  body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
  }
  body {
    font-family: Arial, sans-serif;
  }</style
><style>
  body {
    background: #f8fafc;
    padding: 72px;
  }
  h1 {
    font-size: 48px;
    font-weight: 800;
    color: #0f172a;
  }
  .row {
    display: flex;
    gap: 32px;
    margin-top: 48px;
  }
  .card {
    width: 340px;
    height: 220px;
    border-radius: 18px;
    padding: 28px;
    font-size: 22px;
    color: #1e293b;
  }
  .inset {
    background: #e2e8f0;
    box-shadow: inset 0 6px 18px rgba(15, 23, 42, 0.35);
  }
  .drop {
    background: #f8fafc;
    box-shadow: 0 18px 40px rgba(15, 23, 42, 0.25);
  }
  .plain {
    background: #fff;
  }
</style>
<h1>Shadows carry the layout</h1>
<div class="row">
  <div class="card inset">Inset shadow card (pressed look).</div>
  <div class="card drop">
    Drop-shadow card: same colour as the slide, only the shadow separates it.
  </div>
  <div class="card plain">Plain white card.</div>
</div>
