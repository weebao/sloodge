<!doctype html><meta charset="utf-8" /><style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html,
  body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
  }
  body {
    font-family: Arial, sans-serif;
  }
</style>
<style>
  /* Review r3, blocker B1: a paint property on <body> is outside `body.querySelectorAll('*')`, so
     for two rounds nothing censused it and nothing scored it. Chromium renders every colour on this
     slide as its exact complement; the exporter emits the authored hexes. */
  body {
    filter: invert(1);
    background: #ffffff;
    padding: 64px;
  }
  h1 {
    font-size: 52px;
    font-weight: 800;
    color: #1d4ed8;
  }
  .panel {
    margin-top: 44px;
    background: #e2e8f0;
    border-radius: 16px;
    padding: 40px;
  }
  .panel p {
    font-size: 24px;
    line-height: 1.6;
    color: #0f172a;
  }
</style>
<h1>Inverted by a filter on body</h1>
<div class="panel">
  <p>
    The panel renders near-black and this paragraph renders near-white. Emitting #E2E8F0 and #0F172A
    hands the reader a photographic negative of the slide.
  </p>
</div>
