<!doctype html><meta charset="utf-8" /><style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html,
  body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
  }
  body {
    font-family: Arial, sans-serif;
  }</style
><style>
  body {
    background: #fefce8;
    padding: 60px;
    position: relative;
  }
  h1 {
    font-size: 44px;
    font-weight: 800;
    color: #1c1917;
    width: 600px;
  }
  .card {
    position: absolute;
    left: 80px;
    top: 220px;
    width: 420px;
    height: 200px;
    background: #fff;
    border: 2px solid #d6d3d1;
    border-radius: 14px;
    transform: rotate(-6deg);
    padding: 24px;
  }
  .card p {
    font-size: 22px;
    color: #292524;
    width: 300px;
  }
  .badge {
    position: absolute;
    right: 20px;
    bottom: 20px;
    background: #dc2626;
    color: #fff;
    font-weight: 800;
    font-size: 18px;
    padding: 8px 14px;
    transform: rotate(20deg);
  }
  .sticker {
    position: absolute;
    left: 620px;
    top: 200px;
    background: #2563eb;
    color: #fff;
    font-size: 30px;
    font-weight: 800;
    padding: 14px 26px;
    transform: rotate(28deg);
  }
  .origin {
    position: absolute;
    left: 620px;
    top: 380px;
    width: 320px;
    background: #16a34a;
    color: #fff;
    font-size: 24px;
    font-weight: 700;
    padding: 12px 20px;
    transform: rotate(10deg);
    transform-origin: top left;
  }
  .diag {
    position: absolute;
    left: 1000px;
    top: 160px;
    color: #7c2d12;
    font-size: 26px;
    font-weight: 800;
    transform: rotate(45deg);
  }
  .sixty {
    position: absolute;
    left: 1020px;
    top: 420px;
    color: #0f766e;
    font-size: 26px;
    font-weight: 800;
    transform: rotate(62deg);
  }
</style>

</div>
