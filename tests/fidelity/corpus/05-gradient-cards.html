<!doctype html><meta charset="utf-8" /><style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html,
  body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
  }
  body {
    font-family: Arial, sans-serif;
  }
</style>
<style>
  body {
    background: linear-gradient(135deg, #4c1d95 0%, #1e3a8a 100%);
    padding: 64px;
    color: #fff;
  }
  h1 {
    font-size: 48px;
    font-weight: 800;
    margin-bottom: 36px;
  }
  .grid {
    display: flex;
    gap: 28px;
  }
  .card {
    flex: 1;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
  }
  .card h3 {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 12px;
    color: #fde68a;
  }
  .card p {
    font-size: 17px;
    line-height: 1.6;
    color: #e0e7ff;
  }
  .pill {
    display: inline-block;
    margin-top: 18px;
    background: #fde68a;
    color: #4c1d95;
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 15px;
    font-weight: 700;
  }
</style>
<h1>Platform Pillars</h1>
<div class="grid">
  <div class="card">
    <h3>Speed</h3>
    <p>Sub-second generation on commodity hardware.</p>
    <span class="pill">Shipped</span>
  </div>
  <div class="card">
    <h3>Fidelity</h3>
    <p>Pixel-accurate export to every major format.</p>
    <span class="pill">In progress</span>
  </div>
  <div class="card">
    <h3>Privacy</h3>
    <p>Everything runs locally by default.</p>
    <span class="pill">Shipped</span>
  </div>
</div>
